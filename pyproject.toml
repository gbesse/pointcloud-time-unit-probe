[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-time-unit-probe"
version = "0.1.0a1"
description = "FR: Comparer les hypothèses d’unité des horodatages de points | EN: Compare point timestamp unit hypotheses | ES: Comparar hipótesis de unidades de marcas temporales de puntos"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
pointcloud-time-unit-probe = "pointcloud_time_unit_probe.__main__:main"

[tool.setuptools.packages.find]
include = ["pointcloud_time_unit_probe*"]
